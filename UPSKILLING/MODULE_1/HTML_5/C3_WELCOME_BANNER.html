<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Event Portal - Welcome Banner</title>
    <style>
      #welcomeBanner {
        background-color: #0077cc;
        color: white;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .highlight {
        background-color: #ffeb3b;
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <!-- Main -->
    <div id="welcomeBanner">
      <h1>Welcome Back, Community Member!</h1>
      <p class="highlight">Your personalized event dashboard is ready.</p>
      <p>
        Special Offer:
        <span style="color: red; font-weight: bold"
          >Register now and get a discount on the next event.</span
        >
      </p>
    </div>

    <section>
      <h2 class="highlight">Today's Spotlight</h2>
      <p>Explore events, workshops, and volunteer opportunities near you.</p>
    </section>

    <!-- Footer -->
    <footer>
      <p>Event Portal | Welcome Message Example</p>
    </footer>
  </body>
</html>
