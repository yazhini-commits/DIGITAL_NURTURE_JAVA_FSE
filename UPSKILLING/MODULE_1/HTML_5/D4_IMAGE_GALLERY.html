<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Event Portal - Image Gallery</title>
    <style>
      .gallery-image {
        width: 150px;
        height: 100px;
        border: 3px solid #006699;
        border-radius: 8px;
        object-fit: cover;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 16px;
      }

      td {
        padding: 8px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Community Events Gallery</h1>
      <table>
        <caption>
          Photos from past local community events
        </caption>
        <tr>
          <td>
            <img
              src="https://via.placeholder.com/150x100?text=Festival"
              alt="Local festival celebration"
              title="City Festival"
              class="gallery-image"
            />
            <p>Street festival with music.</p>
          </td>
          <td>
            <img
              src="https://via.placeholder.com/150x100?text=Market"
              alt="Community farmers market"
              title="Farmers Market"
              class="gallery-image"
            />
            <p>Farmers market and local vendors.</p>
          </td>
          <td>
            <img
              src="https://via.placeholder.com/150x100?text=Cleanup"
              alt="Park cleanup event"
              title="Park Cleanup"
              class="gallery-image"
            />
            <p>Neighborhood park cleanup day.</p>
          </td>
        </tr>
        <tr>
          <td>
            <img
              src="https://via.placeholder.com/150x100?text=Concert"
              alt="Outdoor concert"
              title="Outdoor Concert"
              class="gallery-image"
            />
            <p>Live community concert.</p>
          </td>
          <td>
            <img
              src="https://via.placeholder.com/150x100?text=Charity"
              alt="Charity run event"
              title="Charity Run"
              class="gallery-image"
            />
            <p>5K charity run for local causes.</p>
          </td>
          <td>
            <img
              src="https://via.placeholder.com/150x100?text=Workshop"
              alt="Art workshop"
              title="Art Workshop"
              class="gallery-image"
            />
            <p>Hands-on art and craft workshop.</p>
          </td>
        </tr>
      </table>
    </main>
  </body>
</html>
