<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Cards and Media</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <div class="card mb-4" style="max-width: 540px">
        <img
          src="https://via.placeholder.com/540x240"
          class="card-img-top"
          alt="Profile image"
        />
        <div class="card-body">
          <h5 class="card-title">Profile Card</h5>
          <p class="card-text">
            This card uses Bootstrap card classes for a clean profile layout.
          </p>
        </div>
      </div>

      <div class="d-flex align-items-start bg-light p-3 rounded">
        <img
          src="https://via.placeholder.com/120"
          class="me-3 rounded"
          alt="Media image"
        />
        <div>
          <h5 class="mt-0">Media Object</h5>
          <p>
            Use Bootstrap utilities to align media and content horizontally.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
