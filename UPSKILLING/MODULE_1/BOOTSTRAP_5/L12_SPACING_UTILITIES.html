<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Spacing Utilities</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <section class="mb-4 p-4 bg-white border rounded">
        <h2 class="mb-3">Spacing Utilities</h2>
        <p class="m-3 p-2 bg-light">
          This section demonstrates margin and padding utilities such as
          <code>m-3</code> and <code>p-2</code>.
        </p>
      </section>
      <section class="p-5 bg-secondary text-white rounded">
        <div class="row">
          <div class="col-md-4 mb-3">
            <div class="p-4 bg-white text-dark rounded">Pricing Box 1</div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="p-4 bg-white text-dark rounded">Pricing Box 2</div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="p-4 bg-white text-dark rounded">Pricing Box 3</div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
