<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Borders and Shadows</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div
        class="border border-primary border-3 rounded-circle d-inline-block p-3 mb-4"
      >
        <img
          src="https://via.placeholder.com/120"
          class="rounded-circle"
          alt="Rounded Image"
        />
      </div>
      <div class="card shadow mb-3" style="max-width: 540px">
        <div class="card-body rounded-pill shadow-lg">
          <h5 class="card-title">Shadow Card</h5>
          <p class="card-text">
            This example uses <code>shadow</code>, <code>shadow-lg</code>, and
            <code>rounded-pill</code>.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
