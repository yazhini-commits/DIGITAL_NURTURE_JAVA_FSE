<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Column Layouts</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-4">Column Layout Examples</h1>
      <div class="row mb-4">
        <div class="col-12 col-md-3 bg-light p-4 border">
          Sidebar (col-md-3)
        </div>
        <div class="col-12 col-md-9 bg-white p-4 border">
          Content area (col-md-9)
        </div>
      </div>
      <div class="row">
        <div class="col-6 col-sm-3 bg-primary text-white p-3">Box 1</div>
        <div class="col-6 col-sm-3 bg-secondary text-white p-3">Box 2</div>
        <div class="col-6 col-sm-3 bg-success text-white p-3">Box 3</div>
        <div class="col-6 col-sm-3 bg-warning text-dark p-3">Box 4</div>
      </div>
    </div>
  </body>
</html>
