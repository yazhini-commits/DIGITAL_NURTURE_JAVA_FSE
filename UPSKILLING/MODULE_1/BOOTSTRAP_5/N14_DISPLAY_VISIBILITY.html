<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Display and Visibility</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <div class="d-none d-md-block p-3 bg-info text-white mb-3">
        Visible on md and larger, hidden on smaller.
      </div>
      <div class="d-lg-flex p-3 bg-success text-white mb-3">
        Flex only on large screens.
      </div>
      <div class="bg-light border p-3 invisible">
        This element is invisible but still takes space.
      </div>
      <div class="bg-light border p-3 mt-3 d-none">
        This element is removed from layout.
      </div>
    </div>
  </body>
</html>
