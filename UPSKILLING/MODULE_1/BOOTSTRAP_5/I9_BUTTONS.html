<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Buttons</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <h1 class="mb-4">Bootstrap Buttons</h1>
      <div class="mb-3">
        <button class="btn btn-primary me-2">Primary</button>
        <button class="btn btn-secondary me-2">Secondary</button>
        <button class="btn btn-outline-success me-2">Outline Success</button>
        <button class="btn btn-outline-danger">Outline Danger</button>
      </div>
      <div class="btn-group" role="group" aria-label="Button group">
        <button class="btn btn-outline-primary">Left</button>
        <button class="btn btn-outline-primary">Middle</button>
        <button class="btn btn-outline-primary">Right</button>
      </div>
      <div class="mt-4 btn-group" role="group" aria-label="Toggle buttons">
        <input
          type="checkbox"
          class="btn-check"
          id="btncheck1"
          autocomplete="off"
        />
        <label class="btn btn-outline-primary" for="btncheck1">Toggle 1</label>
        <input
          type="checkbox"
          class="btn-check"
          id="btncheck2"
          autocomplete="off"
        />
        <label class="btn btn-outline-primary" for="btncheck2">Toggle 2</label>
      </div>
    </div>
  </body>
</html>
