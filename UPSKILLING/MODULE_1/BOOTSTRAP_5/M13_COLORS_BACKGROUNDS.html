<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Colors and Backgrounds</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-5">
      <div class="p-4 mb-3 bg-primary text-white rounded">
        Primary background
      </div>
      <div class="p-4 mb-3 bg-warning text-dark rounded">
        Warning background
      </div>
      <div class="p-4 mb-3 bg-success text-white rounded">
        Success background
      </div>
      <div class="p-4 bg-gradient bg-dark text-white rounded">
        Gradient dark background
      </div>
    </div>
  </body>
</html>
