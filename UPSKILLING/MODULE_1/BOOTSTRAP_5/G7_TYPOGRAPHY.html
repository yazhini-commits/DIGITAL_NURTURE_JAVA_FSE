<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Typography</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <h1 class="display-1">Display 1 Heading</h1>
      <p class="lead">
        This is a lead paragraph using Bootstrap typography utilities.
      </p>
      <p class="text-muted">
        This text uses the <code>text-muted</code> utility.
      </p>
      <p class="fw-bold">This paragraph is bold with <code>fw-bold</code>.</p>
      <p class="text-uppercase">This text is uppercase.</p>
      <p class="text-lowercase">THIS TEXT IS LOWERCASE.</p>
      <p class="text-capitalize">this text is capitalized.</p>
    </div>
  </body>
</html>
