<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Responsive Grid</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-4">Responsive Grid Layout</h1>
      <div class="row">
        <div class="col-12 col-sm-6 col-lg-4 mb-3">
          <div class="p-4 bg-primary text-white rounded">Column 1</div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4 mb-3">
          <div class="p-4 bg-secondary text-white rounded">Column 2</div>
        </div>
        <div class="col-12 col-sm-6 col-lg-4 mb-3">
          <div class="p-4 bg-success text-white rounded">Column 3</div>
        </div>
      </div>
    </div>
  </body>
</html>
