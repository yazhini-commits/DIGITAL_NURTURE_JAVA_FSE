<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Positioning Utilities</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div
        class="bg-white border p-4 rounded mb-4"
        style="min-height: 180px; position: relative"
      >
        <span
          class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
          >Badge</span
        >
        <h4>Positioned Element</h4>
        <p class="mb-0">
          This layout uses <code>position-relative</code> and
          <code>position-absolute</code> to place a badge.
        </p>
      </div>
      <footer
        class="position-fixed bottom-0 start-0 end-0 bg-dark text-white text-center py-2"
      >
        Fixed Footer
      </footer>
    </div>
  </body>
</html>
