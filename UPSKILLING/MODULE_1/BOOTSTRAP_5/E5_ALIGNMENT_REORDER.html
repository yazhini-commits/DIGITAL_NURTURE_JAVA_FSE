<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Alignment and Reordering</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container py-4">
      <h1 class="mb-4">Alignment and Reordering</h1>
      <div
        class="row justify-content-center align-items-center bg-light p-4 mb-4"
        style="min-height: 180px"
      >
        <div
          class="col-12 col-md-4 text-center p-3 bg-primary text-white rounded mb-2"
        >
          Centered Item 1
        </div>
        <div
          class="col-12 col-md-4 text-center p-3 bg-secondary text-white rounded mb-2"
        >
          Centered Item 2
        </div>
      </div>

      <div class="row">
        <div class="col-12 col-md-6 order-md-2 bg-warning p-4 rounded mb-3">
          Order MD 2
        </div>
        <div class="col-12 col-md-6 order-md-1 bg-info p-4 rounded mb-3">
          Order MD 1
        </div>
      </div>
    </div>
  </body>
</html>
